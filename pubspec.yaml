name: smartfit
description: "智能健身助手 — 描述训练场景，按模板生成训练计划，预渲染动作跟练。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Same pinned versions as HipLab (lib/core and lib/voice are copied from it).
  shared_preferences: 2.5.6
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  just_audio: 0.10.6
  audio_session: 0.2.4
  wakelock_plus: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/library/
    - assets/drill_media/
    - assets/voice/
    - assets/voice/zh/
    - assets/voice/chime/
    - assets/licenses/
